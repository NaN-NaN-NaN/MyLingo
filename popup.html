<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLingo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .toggle-section {
      background: #F9FAFB;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 600;
      color: #1F2937;
    }

    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #D1D5DB;
      transition: 0.3s;
      border-radius: 14px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #10B981;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .section {
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 14px;
      font-weight: 600;
      color: #6B7280;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #E5E7EB;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: white;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .form-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .stats {
      background: #F9FAFB;
      border-radius: 12px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: #6B7280;
      margin-top: 4px;
    }

    .button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #ECFDF5;
      border: 1px solid #10B981;
      border-radius: 8px;
      margin-top: 12px;
    }

    .status-indicator.disabled {
      background: #FEF2F2;
      border-color: #EF4444;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
    }

    .status-dot.disabled {
      background: #EF4444;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #065F46;
    }

    .status-text.disabled {
      color: #991B1B;
    }

    .footer {
      padding: 16px 20px;
      background: #F9FAFB;
      border-top: 1px solid #E5E7EB;
      text-align: center;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌍 MyLingo</h1>
      <p>AI-Powered Language Learning</p>
    </div>

    <div class="content">
      <!-- Toggle MyLingo ON/OFF -->
      <div class="toggle-section">
        <span class="toggle-label">MyLingo Status</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleMyLingo">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div id="statusIndicator" class="status-indicator disabled">
        <span class="status-dot disabled"></span>
        <span class="status-text disabled">Disabled</span>
      </div>

      <!-- Settings -->
      <div class="section">
        <h2>⚙️ Settings</h2>
        
        <div class="form-group">
          <label class="form-label">Target Language (Learning)</label>
          <select id="targetLanguage" class="form-select">
            <option value="es">🇪🇸 Español (Spanish)</option>
            <option value="fr">🇫🇷 Français (French)</option>
            <option value="de">🇩🇪 Deutsch (German)</option>
            <option value="it">🇮🇹 Italiano (Italian)</option>
            <option value="pt">🇧🇷 Português (Portuguese)</option>
            <option value="ja">🇯🇵 日本語 (Japanese)</option>
            <option value="ko">🇰🇷 한국어 (Korean)</option>
            <option value="zh">🇨🇳 中文 (Chinese)</option>
            <option value="ar">🇸🇦 العربية (Arabic)</option>
            <option value="ru">🇷🇺 Русский (Russian)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Native Language (UI Language)</label>
          <select id="nativeLanguage" class="form-select">
            <option value="zh-CN">🇨🇳 简体中文</option>
            <option value="en">🇺🇸 English</option>
            <option value="es">🇪🇸 Español</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="ar">🇸🇦 العربية</option>
            <option value="pt">🇧🇷 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="ja">🇯🇵 日本語</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Proficiency Level</label>
          <select id="proficiencyLevel" class="form-select">
            <option value="A1">A1 - Beginner</option>
            <option value="A2">A2 - Elementary</option>
            <option value="B1" selected>B1 - Intermediate</option>
            <option value="B2">B2 - Upper Intermediate</option>
            <option value="C1">C1 - Advanced</option>
            <option value="C2">C2 - Proficient</option>
          </select>
        </div>
      </div>

      <!-- Stats -->
      <div class="section">
        <h2>📊 Your Progress</h2>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-value" id="notesCount">0</span>
            <span class="stat-label">Words Saved</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="todayCount">0</span>
            <span class="stat-label">Today</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <button class="button" id="viewNotesBtn">📚 View My Notes</button>
    </div>

    <div class="footer">
      Chrome Built-in AI Challenge 2025
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
